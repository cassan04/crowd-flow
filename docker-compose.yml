# Yera will set the container's network here

# 4 containers: backend, frontend, DB, Kafka (MOM) 

networks:
  app-network:
    driver: bridge

services:
  database:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${DB_NAME:-afluencia_db}
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-examplepassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro,Z
    networks:
      - app-network
    restart: unless-stopped
    ports:
      - "5432:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-root} -d ${DB_NAME:-afluencia_db}']
      interval: 5s
      timeout: 5s
      retries: 10

  # KRaft mode (no ZooKeeper): a single container acting as both broker and controller.
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka_broker
    ports:
      - '29092:29092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: ${NODE_ENV:-development}
    container_name: node_backend
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:${API_PORT:-5000}/${API_VERSION:-v1}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-afluencia_db}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-examplepassword}
      KAFKA_BROKER: kafka:9092
      API_PORT: ${API_PORT:-5000}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      database:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped
    ports:
      - '${API_PORT:-5000}:${API_PORT:-5000}'

  vision-service:
    build:
      context: ./vision-service
    container_name: vision_app
    volumes:
      - ./vision-service:/app
    environment:
      KAFKA_BROKER: kafka:9092
      BACKEND_URL: http://backend:${API_PORT:-5000}/${API_VERSION:-v1}/metrics
    depends_on:
      kafka:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # Frontend disabled until Paula starts working on it
  # To activate it, uncomment this and the corresponding parts of start.sh.
  #
  # frontend:
