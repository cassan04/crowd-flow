services:
  database:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${DB_NAME:?You must define DB_NAME}
      POSTGRES_USER: ${DB_USER:?You must define DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?You must define DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro,Z
    restart: unless-stopped
    ports:
      - "5432:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 10

  # KRaft mode (no ZooKeeper): a single container acting as both broker and controller.
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka_broker
    ports:
      - '29092:29092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: node_backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:${API_PORT}/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./backend:/app
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BROKER: kafka:9092
      API_PORT: ${API_PORT:?You must define API_PORT}
      CORS_ORIGIN: ${CORS_ORIGIN:?You must define CORS_ORIGIN}
    depends_on:
      database:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped
    ports:
      - '${API_PORT}:${API_PORT}'

  vision-service:
    build:
      context: ./vision-service
    container_name: vision_app
    volumes:
      - ./vision-service:/app
    environment:
      KAFKA_BROKER: kafka:9092
    depends_on:
      kafka:
        condition: service_started
      # The backend consumer uses fromBeginning: false, so it must be subscribed
      # before the vision service starts publishing.
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Development only: the Vite dev server. Production (Apache serving the built
  # assets) is not set up yet.
  frontend:
    build:
      context: ./frontend
    container_name: react_frontend
    volumes:
      - ./frontend:/app
    ports:
      - '5173:5173'
    environment:
      # The browser runs on the host, so it reaches the API through localhost
      VITE_API_URL: http://localhost:${API_PORT}/v1

volumes:
  postgres_data: