services:
  database:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${DB_NAME:?You must define DB_NAME}
      POSTGRES_USER: ${DB_USER:?You must define DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?You must define DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro,Z
    restart: unless-stopped
    ports:
      - "5432:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 10

  # KRaft mode (no ZooKeeper): a single container acting as both broker and controller.
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka_broker
    ports:
      - '29092:29092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: ${NODE_ENV:?You must define NODE_ENV (development or production)}
    container_name: node_backend
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:${API_PORT}/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BROKER: kafka:9092
      API_PORT: ${API_PORT:?You must define API_PORT}
      CORS_ORIGIN: ${CORS_ORIGIN:?You must define CORS_ORIGIN}
      NODE_ENV: ${NODE_ENV}
    depends_on:
      database:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped
    ports:
      - '${API_PORT}:${API_PORT}'

  vision-service:
    build:
      context: ./vision-service
    container_name: vision_app
    volumes:
      - ./vision-service:/app
    environment:
      KAFKA_BROKER: kafka:9092
    depends_on:
      kafka:
        condition: service_started
      # The backend consumer uses fromBeginning: false, so it must be subscribed
      # before the vision service starts publishing.
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Frontend disabled until Paula starts working on it
  # To activate it, uncomment this and the corresponding parts of start.sh.
  #
  # frontend:
  #   build:
  #     context: ./frontend
  #     target: development
  #   container_name: frontend_dev
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   ports:
  #     - '5173:5173'
  #   environment:
  #     CHOKIDAR_USEPOLLING: 'true'
  #
  # apache:
  #   profiles: ['prod']
  #   build:
  #     context: ./frontend
  #     target: production
  #   container_name: apache_frontend
  #   # TODO: if Apache needs its own configuration (SPA fallback, proxy to the
  #   # backend...), create frontend/apache/httpd.conf and mount it at
  #   # /usr/local/apache2/conf/httpd.conf (the path used by httpd:2.4-alpine).
  #   ports:
  #     - '80:80'
  #   depends_on:
  #     backend:
  #       condition: service_started
  #   restart: unless-stopped

volumes:
  postgres_data: