# Yera will set the container's network here

# 4 containers: backend, frontend, DB, Kafka (MOM) 

networks:
  app-network:
    driver: bridge

services:
  database:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${DB_NAME:-afluencia_db}
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-examplepassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
    networks:
      - app-network
    restart: unless-stopped
    ports:
      - "5432:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-root} -d ${DB_NAME:-afluencia_db}']
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - app-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka_broker
    depends_on:
      - zookeeper
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: ${NODE_ENV:-development}
    container_name: node_backend
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:${API_PORT:-5000}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-afluencia_db}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-examplepassword}
      KAFKA_BROKER: kafka:9092
      API_PORT: ${API_PORT:-5000}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      database:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped
    ports:
      - '${API_PORT:-5000}:${API_PORT:-5000}'

  vision-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.vision
    container_name: vision_app
    volumes:
      - ./vision-service:/app
    environment:
      KAFKA_BROKER: kafka:9092
      BACKEND_URL: http://backend:${API_PORT:-5000}/api/v1/occupancy
    depends_on:
      kafka:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      target: development
    container_name: frontend_dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - '5173:5173'
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    networks:
      - app-network

  apache:
    profiles: ['prod']
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      target: production
    container_name: apache_frontend
    volumes:
      - ./docker/apache/apache2.conf:/etc/apache2/apache2.conf:ro
      - ./docker/apache/000-default.conf:/etc/apache2/sites-enabled/000-default.conf:ro
      - ./docker/apache/security.conf:/etc/apache2/conf-enabled/security.conf:ro
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data: