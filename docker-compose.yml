  # apache:
  #   profiles: ['prod']
  #   build:
  #     context: ./frontend
  #     target: production
  #   container_name: apache_frontend
  #   # TODO: si hace falta configuración propia de Apache (SPA fallback, proxy
  #   # al backend...), crear frontend/apache/httpd.conf y montarlo en
  #   # /usr/local/apache2/conf/httpd.conf (ruta de la imagen httpd:2.4-alpine).
  #   ports:
